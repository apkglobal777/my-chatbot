```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chatbot</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chat-app {
  width: 95%;
  max-width: 850px;
  height: 90vh;
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

/* Header */
.header {
  background: #111827;
  color: white;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #4f46e5;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
}

.logo h1 {
  font-size: 20px;
}

.logo p {
  font-size: 12px;
  color: #cbd5e1;
  margin-top: 3px;
}

.clear {
  border: 1px solid #64748b;
  background: transparent;
  color: white;
  padding: 9px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.clear:hover {
  background: #374151;
}

/* Quick Questions */
.quick {
  display: flex;
  gap: 8px;
  padding: 12px;
  overflow-x: auto;
  border-bottom: 1px solid #e5e7eb;
}

.quick button {
  white-space: nowrap;
  border: 1px solid #6366f1;
  color: #4f46e5;
  background: white;
  padding: 8px 13px;
  border-radius: 20px;
  cursor: pointer;
}

.quick button:hover {
  background: #4f46e5;
  color: white;
}

/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: #f8fafc;
}

.message {
  display: flex;
  margin-bottom: 18px;
}

.message.user {
  justify-content: flex-end;
}

.message.bot {
  justify-content: flex-start;
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #e0e7ff;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-right: 8px;
  flex-shrink: 0;
}

.user .avatar {
  display: none;
}

.bubble {
  max-width: 78%;
  padding: 13px 16px;
  border-radius: 17px;
  line-height: 1.6;
  font-size: 15px;
  word-wrap: break-word;
}

.bot .bubble {
  background: white;
  color: #111827;
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.user .bubble {
  background: #4f46e5;
  color: white;
  border-bottom-right-radius: 4px;
}

/* Typing */
.typing {
  display: none;
  padding: 0 20px 10px;
  background: #f8fafc;
  align-items: center;
  gap: 5px;
}

.dot {
  width: 8px;
  height: 8px;
  background: #64748b;
  border-radius: 50%;
  animation: blink 1.2s infinite;
}

.dot:nth-child(2) {
  animation-delay: .15s;
}

.dot:nth-child(3) {
  animation-delay: .3s;
}

@keyframes blink {
  0%, 60%, 100% {
    transform: translateY(0);
  }

  30% {
    transform: translateY(-6px);
  }
}

/* Input */
.input-area {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #e5e7eb;
  background: white;
}

#input {
  flex: 1;
  border: 1px solid #d1d5db;
  border-radius: 25px;
  padding: 13px 18px;
  outline: none;
  font-size: 15px;
}

#input:focus {
  border-color: #4f46e5;
  box-shadow: 0 0 0 3px rgba(79,70,229,.1);
}

#send {
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 50%;
  background: #4f46e5;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

#send:hover {
  background: #3730a3;
}

#send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

@media(max-width:600px) {
  body {
    align-items: stretch;
  }

  .chat-app {
    width: 100%;
    height: 100vh;
    border-radius: 0;
  }

  .bubble {
    max-width: 88%;
  }
}
</style>
</head>

<body>

<div class="chat-app">

  <!-- HEADER -->
  <div class="header">

    <div class="logo">

      <div class="logo-icon">🤖</div>

      <div>
        <h1>Groq AI Assistant</h1>
        <p>AI chatbot powered by Groq</p>
      </div>

    </div>

    <button class="clear" onclick="clearChat()">
      Clear
    </button>

  </div>


  <!-- QUICK QUESTIONS -->
  <div class="quick">

    <button onclick="askQuick('What is Artificial Intelligence?')">
      🤖 What is AI?
    </button>

    <button onclick="askQuick('Teach me HTML for beginners')">
      🌐 Learn HTML
    </button>

    <button onclick="askQuick('Explain Python for beginners')">
      🐍 Python
    </button>

    <button onclick="askQuick('Give me a JavaScript project idea')">
      ⚡ JavaScript
    </button>

  </div>


  <!-- CHAT -->
  <div class="messages" id="messages">

    <div class="message bot">

      <div class="avatar">🤖</div>

      <div class="bubble">
        👋 <b>Hello!</b><br><br>
        I am your Groq AI assistant.
        <br><br>
        Ask me anything!
      </div>

    </div>

  </div>


  <!-- TYPING -->
  <div class="typing" id="typing">

    <div class="avatar">🤖</div>

    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>

  </div>


  <!-- INPUT -->
  <div class="input-area">

    <input
      id="input"
      type="text"
      placeholder="Type your message..."
      autocomplete="off"
    >

    <button id="send" onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>


<script>

/*
====================================================
  GROQ API KEY
====================================================

IMPORTANT:
Create a NEW key in Groq after rotating the key
you previously posted.

Then replace:

PASTE_NEW_KEY_HERE

with your new key.
*/

const GROQ_API_KEY = "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";


/*
====================================================
  GROQ API
====================================================
*/

const API_URL =
  "https://api.groq.com/openai/v1/chat/completions";


/*
====================================================
  MODEL
====================================================
*/

const MODEL = "llama-3.3-70b-versatile";


/*
====================================================
  ELEMENTS
====================================================
*/

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");
const typing = document.getElementById("typing");


/*
====================================================
  CONVERSATION MEMORY
====================================================
*/

let conversation = [

  {
    role: "system",

    content:
      "You are a friendly and helpful AI assistant. " +
      "Give accurate and easy-to-understand answers. " +
      "Help users with programming, AI, web development, " +
      "Python, JavaScript, HTML, CSS, GitHub and general questions."
  }

];


/*
====================================================
  ENTER KEY
====================================================
*/

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    sendMessage();

  }

});


/*
====================================================
  ESCAPE HTML
====================================================
*/

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/*
====================================================
  FORMAT AI RESPONSE
====================================================
*/

function formatResponse(text) {

  let result = escapeHTML(text);

  /*
    Bold markdown
  */

  result = result.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );


  /*
    Code blocks
  */

  result = result.replace(
    /```([\s\S]*?)```/g,
    "<pre>$1</pre>"
  );


  /*
    New lines
  */

  result = result.replace(/\n/g, "<br>");

  return result;

}


/*
====================================================
  ADD MESSAGE
====================================================
*/

function addMessage(text, sender) {

  const message = document.createElement("div");

  message.className = "message " + sender;


  if (sender === "bot") {

    message.innerHTML = `

      <div class="avatar">🤖</div>

      <div class="bubble">
        ${formatResponse(text)}
      </div>

    `;

  } else {

    message.innerHTML = `

      <div class="bubble">
        ${escapeHTML(text)}
      </div>

    `;

  }


  messages.appendChild(message);

  scrollBottom();

}


/*
====================================================
  SCROLL
====================================================
*/

function scrollBottom() {

  messages.scrollTop = messages.scrollHeight;

}


/*
====================================================
  SEND MESSAGE
====================================================
*/

async function sendMessage() {

  const text = input.value.trim();


  if (!text) {
    return;
  }


  /*
    Check API key
  */

  if (
    !GROQ_API_KEY ||
    GROQ_API_KEY === "PASTE_NEW_KEY_HERE"
  ) {

    addMessage(
      "⚠️ Please add your NEW Groq API key in the JavaScript section.",
      "bot"
    );

    return;

  }


  /*
    Display user message
  */

  addMessage(text, "user");


  /*
    Clear input
  */

  input.value = "";


  /*
    Disable button
  */

  send.disabled = true;


  /*
    Show typing
  */

  typing.style.display = "flex";

  scrollBottom();


  /*
    Add to memory
  */

  conversation.push({

    role: "user",

    content: text

  });


  try {

    /*
      Call Groq
    */

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {

        "Content-Type": "application/json",

        "Authorization":
          "Bearer " + GROQ_API_KEY

      },

      body: JSON.stringify({

        model: MODEL,

        messages: conversation,

        temperature: 0.7,

        max_tokens: 1500

      })

    });


    /*
      Convert response to JSON
    */

    const data = await response.json();


    /*
      Check errors
    */

    if (!response.ok) {

      throw new Error(
        data?.error?.message ||
        "Groq API request failed"
      );

    }


    /*
      Get AI response
    */

    const answer =
      data?.choices?.[0]?.message?.content;


    if (!answer) {

      throw new Error(
        "No response received from Groq."
      );

    }


    /*
      Save AI response
    */

    conversation.push({

      role: "assistant",

      content: answer

    });


    /*
      Hide typing
    */

    typing.style.display = "none";


    /*
      Display response
    */

    addMessage(answer, "bot");


  } catch (error) {

    console.error(error);


    typing.style.display = "none";


    addMessage(

      "❌ Error: " +
      error.message +
      "<br><br>" +
      "Please check your Groq API key and internet connection.",

      "bot"

    );

  }


  /*
    Enable send button
  */

  send.disabled = false;

  input.focus();

}


/*
====================================================
  QUICK QUESTIONS
====================================================
*/

function askQuick(question) {

  input.value = question;

  sendMessage();

}


/*
====================================================
  CLEAR CHAT
====================================================
*/

function clearChat() {

  conversation = [

    {
      role: "system",

      content:
        "You are a friendly and helpful AI assistant. " +
        "Give accurate and easy-to-understand answers. " +
        "Help users with programming, AI, web development, " +
        "Python, JavaScript, HTML, CSS, GitHub and general questions."
    }

  ];


  messages.innerHTML = `

    <div class="message bot">

      <div class="avatar">🤖</div>

      <div class="bubble">

        👋 <b>Chat cleared!</b>
        <br><br>
        Ask me anything.

      </div>

    </div>

  `;

}


/*
====================================================
  FOCUS INPUT
====================================================
*/

input.focus();

</script>

</body>
</html>
```
