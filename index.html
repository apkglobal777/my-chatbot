```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      min-height: 600px;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: white;
      color: #5b21b6;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    .header h1 {
      font-size: 21px;
    }

    .status {
      font-size: 12px;
      opacity: .9;
      margin-top: 3px;
    }

    .clear-btn {
      border: 1px solid rgba(255,255,255,.5);
      background: transparent;
      color: white;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .clear-btn:hover {
      background: rgba(255,255,255,.15);
    }

    /* QUICK BUTTONS */
    .quick-buttons {
      display: flex;
      gap: 8px;
      padding: 12px 15px;
      overflow-x: auto;
      border-bottom: 1px solid #eee;
    }

    .quick-buttons button {
      white-space: nowrap;
      border: 1px solid #6366f1;
      background: white;
      color: #4f46e5;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .quick-buttons button:hover {
      background: #4f46e5;
      color: white;
    }

    /* CHAT */
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f7f8fc;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
      animation: appear .25s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      margin-right: 8px;
      background: #e0e7ff;
    }

    .user .avatar {
      display: none;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 17px;
      line-height: 1.6;
      font-size: 15px;
      word-wrap: break-word;
    }

    .bot .bubble {
      background: white;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .user .bubble {
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* TYPING */
    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      margin-bottom: 15px;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #777;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-6px);
      }
    }

    /* INPUT */
    .input-area {
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 25px;
      padding: 13px 18px;
      font-size: 15px;
      outline: none;
    }

    #userInput:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.1);
    }

    #sendBtn {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #3730a3;
    }

    #sendBtn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* MOBILE */
    @media(max-width:600px) {
      body {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
      }

      .header h1 {
        font-size: 17px;
      }

      .bubble {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

<div class="chat-container">

  <!-- HEADER -->
  <div class="header">

    <div class="brand">
      <div class="bot-icon">🤖</div>

      <div>
        <h1>My AI Assistant</h1>
        <div class="status">● Powered by Groq</div>
      </div>
    </div>

    <button class="clear-btn" onclick="clearChat()">
      Clear
    </button>

  </div>


  <!-- QUICK QUESTIONS -->
  <div class="quick-buttons">
    <button onclick="quickAsk('What is Artificial Intelligence?')">
      🤖 What is AI?
    </button>

    <button onclick="quickAsk('Teach me HTML for beginners')">
      🌐 Learn HTML
    </button>

    <button onclick="quickAsk('Explain Python for beginners')">
      🐍 Python
    </button>

    <button onclick="quickAsk('Give me a JavaScript project idea')">
      ⚡ JavaScript
    </button>
  </div>


  <!-- CHAT AREA -->
  <div class="chat-box" id="chatBox">

    <div class="message bot">
      <div class="avatar">🤖</div>

      <div class="bubble">
        👋 <b>Hello!</b><br><br>
        I am your AI assistant powered by Groq.
        <br><br>
        Ask me anything about programming, AI,
        web development, Python, JavaScript,
        HTML, CSS and more.
      </div>
    </div>

  </div>


  <!-- TYPING -->
  <div class="typing" id="typing">
    <div class="avatar">🤖</div>
    <span></span>
    <span></span>
    <span></span>
  </div>


  <!-- INPUT -->
  <div class="input-area">

    <input
      type="text"
      id="userInput"
      placeholder="Ask me anything..."
      autocomplete="off"
    >

    <button id="sendBtn" onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>


<script>

  /* ==========================================
     PUT YOUR NEW GROQ API KEY HERE
     ========================================== */

  const GROQ_API_KEY = "YOUR_NEW_GROQ_API_KEY";


  /* ==========================================
     GROQ API
     ========================================== */

  const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";


  /*
     Model used by this chatbot.

     If Groq changes model availability,
     update this value from Groq's documentation.
  */

  const MODEL = "llama-3.3-70b-versatile";


  /* ==========================================
     ELEMENTS
     ========================================== */

  const chatBox = document.getElementById("chatBox");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const typing = document.getElementById("typing");


  /* ==========================================
     CHAT MEMORY
     ========================================== */

  let conversation = [

    {
      role: "system",
      content:
        "You are a friendly, helpful AI assistant. " +
        "Give clear and accurate answers. " +
        "Use simple language when explaining concepts. " +
        "You can help with programming, AI, web development, " +
        "Python, JavaScript, HTML, CSS, GitHub and general questions."
    }

  ];


  /* ==========================================
     ENTER KEY
     ========================================== */

  userInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      sendMessage();

    }

  });


  /* ==========================================
     ADD MESSAGE
     ========================================== */

  function addMessage(text, sender) {

    const message = document.createElement("div");

    message.className = "message " + sender;


    if (sender === "bot") {

      message.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble">${formatText(text)}</div>
      `;

    } else {

      message.innerHTML = `
        <div class="bubble">${escapeHTML(text)}</div>
      `;

    }


    chatBox.appendChild(message);

    scrollToBottom();

  }


  /* ==========================================
     TEXT FORMATTING
     ========================================== */

  function formatText(text) {

    let safe = escapeHTML(text);

    safe = safe.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

    safe = safe.replace(
      /\n/g,
      "<br>"
    );

    return safe;

  }


  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  /* ==========================================
     SCROLL
     ========================================== */

  function scrollToBottom() {

    chatBox.scrollTop = chatBox.scrollHeight;

  }


  /* ==========================================
     SEND MESSAGE
     ========================================== */

  async function sendMessage() {

    const message = userInput.value.trim();

    if (!message) {
      return;
    }


    if (
      !GROQ_API_KEY ||
      GROQ_API_KEY === "YOUR_NEW_GROQ_API_KEY"
    ) {

      addMessage(
        "⚠️ Please add your Groq API key in the JavaScript section first.",
        "bot"
      );

      return;

    }


    addMessage(message, "user");


    userInput.value = "";

    sendBtn.disabled = true;

    typing.style.display = "flex";

    scrollToBottom();


    conversation.push({

      role: "user",
      content: message

    });


    try {

      const response = await fetch(GROQ_URL, {

        method: "POST",

        headers: {

          "Content-Type": "application/json",

          "Authorization": "Bearer " + GROQ_API_KEY

        },

        body: JSON.stringify({

          model: MODEL,

          messages: conversation,

          temperature: 0.7,

          max_tokens: 1500

        })

      });


      const data = await response.json();


      if (!response.ok) {

        throw new Error(
          data.error?.message ||
          "Groq API request failed"
        );

      }


      const reply =
        data.choices?.[0]?.message?.content ||
        "Sorry, I could not generate a response.";


      conversation.push({

        role: "assistant",

        content: reply

      });


      typing.style.display = "none";

      addMessage(reply, "bot");


    } catch (error) {

      console.error(error);

      typing.style.display = "none";

      addMessage(

        "❌ Error: " + error.message +
        "<br><br>Please check your API key, internet connection, and Groq API settings.",

        "bot"

      );

    }


    sendBtn.disabled = false;

    userInput.focus();

  }


  /* ==========================================
     QUICK QUESTIONS
     ========================================== */

  function quickAsk(question) {

    userInput.value = question;

    sendMessage();

  }


  /* ==========================================
     CLEAR CHAT
     ========================================== */

  function clearChat() {

    conversation = [

      {
        role: "system",
        content:
          "You are a friendly, helpful AI assistant. " +
          "Give clear and accurate answers. " +
          "Use simple language when explaining concepts. " +
          "You can help with programming, AI, web development, " +
          "Python, JavaScript, HTML, CSS, GitHub and general questions."
      }

    ];


    chatBox.innerHTML = `

      <div class="message bot">

        <div class="avatar">🤖</div>

        <div class="bubble">

          👋 <b>Chat cleared!</b><br><br>

          How can I help you?

        </div>

      </div>

    `;

  }

</script>

</body>
</html>
```
