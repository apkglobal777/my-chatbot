<!DOCTYPE html>
<html lang="en">
<head>

    * {

      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      min-height: 600px;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: white;
      color: #5b21b6;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    .header h1 {
      font-size: 21px;
    }

    .status {
      font-size: 12px;
      opacity: .9;
      margin-top: 3px;
    }

    .clear-btn {
      border: 1px solid rgba(255,255,255,.5);
      background: transparent;
      color: white;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .clear-btn:hover {
      background: rgba(255,255,255,.15);
    }

    /* QUICK BUTTONS */
    .quick-buttons {
      display: flex;
      gap: 8px;
      padding: 12px 15px;
      overflow-x: auto;
      border-bottom: 1px solid #eee;
    }

    .quick-buttons button {
      white-space: nowrap;
      border: 1px solid #6366f1;
      background: white;
      color: #4f46e5;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .quick-buttons button:hover {
      background: #4f46e5;
      color: white;
    }

    /* CHAT */
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f7f8fc;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
      animation: appear .25s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      margin-right: 8px;
      background: #e0e7ff;
    }

    .user .avatar {
      display: none;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 17px;
      line-height: 1.6;
      font-size: 15px;
      word-wrap: break-word;
    }

    .bot .bubble {
      background: white;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .user .bubble {
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* TYPING */
    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      margin-bottom: 15px;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #777;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-6px);
      }
    }

    /* INPUT */
    .input-area {
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 25px;
      padding: 13px 18px;
      font-size: 15px;
      outline: none;
    }

    #userInput:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.1);
    }

    #sendBtn {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #3730a3;
    }

    #sendBtn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* MOBILE */
    @media(max-width:600px) {
      body {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
      }

      .header h1 {
        font-size: 17px;
      }

      .bubble {
        max-width: 85%;
      }
    }
  </style>
</head>
